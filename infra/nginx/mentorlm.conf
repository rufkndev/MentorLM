# Единственная точка входа в прод: фронт и API живут на одном домене, поэтому
# запросы браузера к /api/ — same-origin, и CORS не задействован вовсе.
#
# ⚠️ Перед первым запуском заменить mentorlm.ru на свой домен (4 места ниже).
# ⚠️ nginx не стартует, если сертификата ещё нет — порядок первого запуска
#    описан в README раздела деплоя (сначала certbot, потом полный compose).

# ── Лимиты частоты ────────────────────────────────────────────────────────────
# Единственный лимит, который нельзя обойти заголовком: ключ — реальный адрес
# соединения ($binary_remote_addr), а не X-Forwarded-For, который присылает сам
# клиент. Приложение считает лимиты по правому элементу XFF (apps/core/net.py),
# и это верно, пока запросы приходят только через nginx; здесь — рубеж, который
# работает до того, как запрос вообще дойдёт до Django.
#
# Файл подключается из conf.d, то есть внутри http-контекста — зоны объявляются
# именно здесь, отдельный nginx.conf для этого не нужен.
#
# ⚠️ Числа подобраны с оглядкой на NAT. Наши пользователи — студенты, и целое
# общежитие или корпус вуза выходит в сеть с ОДНОГО адреса. Ключ здесь —
# реальный адрес соединения, то есть общий на всех, поэтому «строгий» лимит на
# весь /api/ выгнал бы из приложения сразу всю аудиторию.
#
# Отсюда деление: жёстко ограничиваем только вход и регистрацию (туда идёт
# перебор паролей), а всё остальное — щедро. Особенно важно, что под «остальное»
# попадает /api/auth/refresh/: его дёргает КАЖДАЯ загрузка страницы у КАЖДОГО
# пользователя, и строгий лимит на нём означает «всех разлогинило».
limit_req_zone $binary_remote_addr zone=auth_login:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=api_zone:10m rate=600r/m;
# Отказ по лимиту — это 429, а не 503: 503 означает «сервер сломался».
limit_req_status 429;

upstream backend {
    server backend:8000;
    keepalive 16;
}

upstream frontend {
    server frontend:3000;
    keepalive 16;
}


# ── HTTP: только проверка Let's Encrypt и редирект ────────────────────────────
server {
    listen 80;
    server_name mentorlm.ru www.mentorlm.ru;

    # Webroot-проверка certbot: единственное, что отдаётся по http.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}


# ── HTTPS ─────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name mentorlm.ru www.mentorlm.ru;

    ssl_certificate     /etc/letsencrypt/live/mentorlm.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mentorlm.ru/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # ── Клиентский сертификат для админки (mTLS) ─────────────────────────────
    # Доступ в /admin/ привязан к устройству, а не к IP-адресу: нужен
    # сертификат, установленный в системе. Как его выпустить — раздел «Админка»
    # в dev_docs/notes/deployNote.md.
    #
    # `optional`, а не `on`: `on` потребовал бы сертификат от КАЖДОГО посетителя
    # сайта. Здесь nginx лишь спрашивает его и записывает результат проверки в
    # $ssl_client_verify, а требование предъявляется только в location /admin/.
    ssl_client_certificate /etc/nginx/certs/admin-ca.crt;
    ssl_verify_client      optional;

    # Вложения — до 10 МБ на файл (apps/conversations/attachments.py), плюс запас
    # на многочастную обёртку.
    client_max_body_size 12m;

    # Заголовки безопасности. Django и Next.js ставят свои на собственных
    # ответах; здесь они нужны для ответов, которые генерирует сам nginx, —
    # редиректа с :80, страницы 50x.html и 403 от гейта админки. Повтор
    # одинакового значения браузеру не мешает.
    #
    # Content-Security-Policy тут НЕТ намеренно: он требует nonce, разного на
    # каждый ответ, и живёт в frontend/mentorlm/src/middleware.ts. Второй
    # CSP-заголовок отсюда применялся бы вдобавок к тому и ломал бы страницы.
    add_header X-Content-Type-Options   nosniff always;
    add_header Referrer-Policy          same-origin always;
    add_header X-Frame-Options          DENY always;
    add_header Strict-Transport-Security "max-age=2592000; includeSubDomains" always;

    # Деплой пересоздаёт контейнер и даёт несколько секунд недоступности —
    # показываем человеческую страницу вместо стандартной ошибки nginx.
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }

    # ── Вход и регистрация ───────────────────────────────────────────────────
    # Строгим лимитом: именно сюда идёт перебор паролей.
    # Точное совпадение (=) вместо префикса: под префикс /api/auth/ попал бы и
    # refresh, который вызывается при каждой загрузке страницы.
    #
    # burst без nodelay: всплеск ставим в очередь, а не отбиваем, — человек,
    # промахнувшийся паролем пару раз подряд, не должен получать 429. Поверх
    # этого работают счётчики приложения (apps/users/auth_views.py): они считают
    # по паре «адрес + почта» и ловят перебор точнее, чем это может nginx.
    location = /api/auth/login/ {
        limit_req zone=auth_login burst=20;

        include /etc/nginx/proxy_params.conf;
        proxy_pass http://backend;
    }

    location = /api/auth/register/ {
        limit_req zone=auth_login burst=20;

        include /etc/nginx/proxy_params.conf;
        proxy_pass http://backend;
    }

    # ── API: потоковые ответы ────────────────────────────────────────────────
    # proxy_buffering off — критично: иначе nginx копит SSE в буфере и отдаёт
    # ответ одним куском в конце, то есть стриминг пропадает.
    # Таймауты с запасом над самым долгим режимом («Исследовать», 900 с).
    location /api/ {
        limit_req zone=api_zone burst=120 nodelay;

        include /etc/nginx/proxy_params.conf;
        proxy_pass http://backend;

        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 1200s;
        proxy_send_timeout 1200s;
        gzip               off;
    }

    # ── Админка ──────────────────────────────────────────────────────────────
    # Пускаем только с устройства, где установлен наш клиентский сертификат.
    # Привязка к железу, а не к адресу: домашний IP динамический, а из поездки
    # или с телефона по IP не зайти вовсе.
    #
    # Вход в саму админку (логин/пароль Django) при этом никуда не девается —
    # сертификат лишь закрывает страницу входа от всего интернета.
    location /admin/ {
        # $ssl_client_verify: SUCCESS — сертификат предъявлен и подписан нашим
        # CA; NONE — не предъявлен; FAILED:<причина> — предъявлен чужой или
        # отозванный. Пускаем только SUCCESS.
        if ($ssl_client_verify != SUCCESS) {
            return 403;
        }

        include /etc/nginx/proxy_params.conf;
        proxy_pass http://backend;
    }

    # Статика админки — её отдаёт whitenoise внутри приложения.
    location /static/ {
        include /etc/nginx/proxy_params.conf;
        proxy_pass http://backend;
        expires 30d;
    }

    # ── Всё остальное — Next.js ──────────────────────────────────────────────
    location / {
        include /etc/nginx/proxy_params.conf;
        proxy_pass http://frontend;
    }
}
