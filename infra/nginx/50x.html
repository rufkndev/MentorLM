<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MentorLM — обновляемся</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f6f7fb;
        color: #10131a;
        font: 450 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
        padding: 24px;
      }
      main { max-width: 32rem; text-align: center; }
      h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.01em; margin: 0 0 12px; }
      p { margin: 0; color: #5a6172; }
      .dot { color: #1746f5; }
      @media (prefers-color-scheme: dark) {
        body { background: #0c0e13; color: #eef1f7; }
        p { color: #9aa2b4; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Обновляемся<span class="dot">.</span></h1>
      <p>Сервис вернётся через минуту. Обновите страницу чуть позже.</p>
    </main>
  </body>
</html>
