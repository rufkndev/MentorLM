# Заголовки, общие для всех проксируемых location'ов (подключается через include).
#
# X-Forwarded-Proto обязателен: на нём держится SECURE_PROXY_SSL_HEADER в
# settings/prod.py. Без него Django считает соединение незащищённым и с
# SECURE_SSL_REDIRECT уходит в бесконечный редирект на https.

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# Переиспользование соединений с upstream'ами (см. keepalive в upstream-блоках):
# требует HTTP/1.1 и пустого Connection.
proxy_http_version 1.1;
proxy_set_header Connection "";
