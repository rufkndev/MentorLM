# Прод-стек MentorLM. Запускать только через infra/deploy.sh — ему нужен
# --env-file, иначе не подставятся build args фронта (см. комментарий у frontend).
#   docker compose --env-file env/.env -f docker-compose.prod.yml up -d --build
# Наружу смотрит только nginx: backend и frontend доступны лишь внутри сети.

# Иначе имя проекта берётся от папки (infra), и тома называются infra_*.
name: mentorlm

# Логи растут бесконечно и однажды забивают диск — ограничиваем всем сервисам.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # Боевая база. Живёт на этом же сервере: 152-ФЗ (ч.5 ст.18) требует, чтобы
  # персональные данные граждан РФ записывались и хранились в базах на
  # территории России, — поэтому не управляемый зарубежный Postgres, а свой.
  # Наружу не смотрит вовсе: ни ports, ни expose. Доступ только из сети compose.
  #
  # Переменные подставляются из env-файла через ${...}, а не через env_file:
  # так в контейнер базы не попадают ключи OpenAI/Anthropic. Подстановка
  # работает потому, что deploy.sh всегда передаёт --env-file.
  db:
    image: postgres:17-alpine
    container_name: mentorlm-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Контрольные суммы страниц: тихое повреждение диска обнаружится, а не
      # уедет в бэкапы. Включается только при инициализации кластера.
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: always
    logging: *default-logging

  # Общий кэш воркеров: лок генерации, rate limit, «Стоп» (apps/billing/guard.py).
  # Без него параллельные запросы одного пользователя проскакивают квоту.
  redis:
    image: redis:7-alpine
    container_name: mentorlm-redis
    # Кэш, а не хранилище: персистентность не нужна. volatile-lru выселяет
    # только ключи с TTL — локи и счётчики лимитов их имеют все.
    command: >
      redis-server --save "" --appendonly no
      --maxmemory 256mb --maxmemory-policy volatile-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: always
    logging: *default-logging

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile.prod
    container_name: mentorlm-backend
    env_file:
      - ./env/.env
    environment:
      # Прод-настройки включаются только здесь: локально по умолчанию dev.
      DJANGO_SETTINGS_MODULE: mentorlm_api.settings.prod
      REDIS_URL: redis://redis:6379/0
      # Адрес базы — часть топологии стека, а не настройка: перекрываем env-файл,
      # рассчитанный на запуск с хоста.
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Даём активным SSE-ответам договорить при деплое: по умолчанию docker ждёт
    # 10 секунд и убивает, обрывая ответ на середине.
    stop_grace_period: 120s
    restart: always
    logging: *default-logging

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile.prod
      # NEXT_PUBLIC_* вшиваются в бандл при сборке, поэтому передаются как args,
      # а не через окружение. Подстановка ${...} работает только с --env-file.
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
    container_name: mentorlm-frontend
    # Секретов у фронта нет вовсе: аутентификация целиком на бэкенде, ключи
    # провайдеров и доступ к БД ему ни к чему. Всё, что нужно, вшито при сборке.
    expose:
      - "3000"
    restart: always
    logging: *default-logging

  nginx:
    image: nginx:1.27-alpine
    container_name: mentorlm-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Кладём поверх default.conf, а не рядом: иначе штатный конфиг образа
      # остаётся сервером по умолчанию и отвечает на запросы с чужим Host.
      - ./nginx/mentorlm.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/proxy_params.conf:/etc/nginx/proxy_params.conf:ro
      - ./nginx/50x.html:/usr/share/nginx/html/50x.html:ro
      # CA для клиентских сертификатов админки (mTLS). Каталог создаётся на
      # сервере и в репозиторий не попадает — там ключ, которым выпускаются
      # пропуска в /admin/. Без него nginx не стартует: см. раздел «Админка»
      # в dev_docs/notes/deployNote.md.
      - ./nginx/certs:/etc/nginx/certs:ro
      - certbot-www:/var/www/certbot
      - letsencrypt:/etc/letsencrypt:ro
    # Перечитываем конфиг раз в 6 часов — так подхватывается продлённый
    # сертификат без ручного вмешательства.
    command: >
      /bin/sh -c "while :; do sleep 6h & wait $${!}; nginx -s reload; done
      & nginx -g 'daemon off;'"
    depends_on:
      - backend
      - frontend
    restart: always
    logging: *default-logging

  # Продление сертификатов. Первый выпуск делается вручную (см. deploy-раздел
  # README): renew умеет только обновлять уже существующий сертификат.
  certbot:
    image: certbot/certbot
    container_name: mentorlm-certbot
    volumes:
      - certbot-www:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
    entrypoint: >
      /bin/sh -c "trap exit TERM;
      while :; do certbot renew --webroot -w /var/www/certbot --quiet;
      sleep 12h & wait $${!}; done"
    restart: always
    logging: *default-logging

volumes:
  # Боевые данные. Том именованный и переживает пересоздание контейнеров;
  # `docker compose down -v` его СНЕСЁТ — этой команды на проде быть не должно.
  pgdata:
  certbot-www:
  letsencrypt:
