services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile.dev
    container_name: mentorlm-backend-dev
    env_file:
      - ./env/.env
    environment:
      DEBUG: "True"
      # REDIS_URL не задаём: без него settings.dev берёт кэш в памяти процесса
      # (лок генерации, rate limit, «Стоп» — billing.guard). Для разработки в
      # один воркер этого достаточно; в проде Redis обязателен и поднимается
      # в docker-compose.prod.yml.
    ports:
      - "8000:8000"
    volumes:
      - ../backend/mentorlm:/app
    restart: unless-stopped
